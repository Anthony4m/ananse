apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: ananse
  labels:
    app: users
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
        app.kubernetes.io/part-of: ananse-mesh
    spec:
      containers:
      - name: users
        image: users:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        - name: PROXY_URL
          value: "http://proxy.ananse.svc.cluster.local:8089"
        - name: SERVICE_NAME
          value: "users"
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "ananse"
        - name: DB_NAME
          value: "ananse"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: postgres-password
        livenessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: "500m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: ananse
  labels:
    ananse.io/mesh: "enabled"
spec:
  selector:
    app: users
  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
  type: ClusterIP
